# Local development database. `docker-compose up -d` gives a fresh
# PostgreSQL instance matching .env.example's fallback DATABASE_URL, with no
# manual password reset or service configuration needed -- for fully offline
# work or CI, where a hosted database is not wanted.
#
# NOT used in production, and not required at all if you point DATABASE_URL
# at a hosted Postgres instead -- Supabase (see .env.example's Database
# section for the connection-string variant to use), RDS, Cloud SQL, or any
# other managed Postgres add-on. This file exists purely to make
# `git clone && docker-compose up -d` a working local setup for anyone who
# would rather not depend on a hosted database during development.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice_app
      POSTGRES_PASSWORD: devpassword_app
      POSTGRES_DB: invoice_processing
    ports:
      - "5432:5432"
    volumes:
      - invoice_processing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_app -d invoice_processing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoice_processing_pgdata:
